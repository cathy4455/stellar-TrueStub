name: Backend CI

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: safetrust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d safetrust"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Snapshot pre-migration schema
        run: |
          psql "$DATABASE_URL" -tAc "
            SELECT table_name FROM information_schema.tables
            WHERE table_schema = 'public'
            ORDER BY table_name" > "$RUNNER_TEMP/schema-before.txt"
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/safetrust

      - name: Apply database migrations
        run: yarn workspace @truestub/backend migrate:up --check-order
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/safetrust

      # Rolls every migration back one at a time, in reverse order, so a broken
      # `-- Down Migration` section fails CI instead of failing during an
      # incident. Then checks that rollback left no tables behind and that the
      # migrations re-apply cleanly on top of the rolled-back schema.
      - name: Roll back every migration
        run: |
          count=$(ls apps/backend/src/db/migrations/*.sql | wc -l)
          for _ in $(seq "$count"); do
            yarn workspace @truestub/backend migrate:down
          done

          remaining=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM pgmigrations")
          if [ "$remaining" != "0" ]; then
            echo "::error::$remaining migration(s) still recorded in pgmigrations after rolling back $count."
            exit 1
          fi

          psql "$DATABASE_URL" -tAc "
            SELECT table_name FROM information_schema.tables
            WHERE table_schema = 'public' AND table_name <> 'pgmigrations'
            ORDER BY table_name" > "$RUNNER_TEMP/schema-after.txt"
          if ! diff -u "$RUNNER_TEMP/schema-before.txt" "$RUNNER_TEMP/schema-after.txt"; then
            echo "::error::Rolling back all migrations left the public schema different from before they were applied (diff above)."
            exit 1
          fi
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/safetrust

      - name: Re-apply database migrations after rollback
        run: yarn workspace @truestub/backend migrate:up --check-order
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/safetrust

      - name: Typecheck backend
        run: yarn workspace @truestub/backend typecheck

      - name: Build backend
        run: yarn workspace @truestub/backend build

      - name: Test backend
        run: yarn workspace @truestub/backend test

      # #261 — hit every mounted route's basic contract (health 200, auth-
      # required routes 401 without/with a bad token, webhook signature check).
      - name: Smoke test backend routes
        run: yarn workspace @truestub/backend test:smoke

      # #261 — boot the compiled server the way production does and make sure
      # it actually listens and responds. Fails if `node dist/index.js` crashes
      # on startup, which unit tests importing the app can't catch.
      - name: Boot compiled backend and check it responds
        working-directory: apps/backend
        env:
          NODE_ENV: development
          PORT: "4100"
          LOG_LEVEL: warn
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/safetrust
          FIREBASE_ADMIN_PROJECT_ID: ci-smoke
          FIREBASE_ADMIN_CLIENT_EMAIL: ci-smoke@ci-smoke.iam.gserviceaccount.com
          # Not a real key, so Firebase Admin starts without credentials.
          FIREBASE_ADMIN_PRIVATE_KEY: ci-smoke-placeholder
        run: |
          node dist/index.js > "$RUNNER_TEMP/backend.log" 2>&1 &
          server_pid=$!

          for _ in $(seq 30); do
            if curl -fsS "http://localhost:$PORT/health" > /dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::Backend exited during startup."
              cat "$RUNNER_TEMP/backend.log"
              exit 1
            fi
            sleep 1
          done

          fail() {
            echo "::error::$1"
            cat "$RUNNER_TEMP/backend.log"
            kill "$server_pid" 2>/dev/null || true
            exit 1
          }

          health=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:$PORT/health")
          [ "$health" = "200" ] || fail "GET /health returned $health, expected 200."

          for path in /api/refunds/claim /api/transfers/initiate /api/changelog /api/disputes; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Content-Type: application/json" -d '{}' "http://localhost:$PORT$path")
            [ "$code" = "401" ] || fail "POST $path without a token returned $code, expected 401."
          done

          kill "$server_pid"
