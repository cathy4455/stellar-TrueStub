# Contracts CI
#
# Implements the plan documented in contracts/CI.md (closes #370).
# Runs on every push or pull request that touches the contracts/ workspace
# or this workflow file itself, so a stale toolchain pin or dependency
# conflict is caught before it reaches main.
#
# NOTE: Cargo.lock is committed intentionally (see contracts/README.md).
# Never add a `cargo update` step here — the lockfile pins ed25519-dalek
# to a working 2.x version to route around an upstream soroban-env-host
# dependency conflict. CI must verify that pin keeps working.

name: Contracts CI

on:
  push:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-ci.yml"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/contracts-ci.yml"

permissions:
  contents: read

jobs:
  contracts:
    name: Format, lint, test, and build (wasm32)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + wasm32-unknown-unknown)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo registry, git index, and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: contracts-${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            contracts-${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: contracts
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        working-directory: contracts
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: contracts
        run: cargo test

      - name: Build for wasm32-unknown-unknown
        working-directory: contracts
        run: cargo build --target wasm32-unknown-unknown --release
